# FreeCAD Modern: light engineering theme.
# Every color used by "FreeCAD Modern.qss" (and by FreeCAD.qss, which it imports) is defined here,
# so a dark or custom variant only needs another copy of this file with different values.

# --- Palette -------------------------------------------------------------------------------------
ModernAccentColor: "#2388F2"
ModernAccentStrongColor: "#1685F8"
ModernAccentPressedColor: "#C6E1FF"
ModernAppBackgroundColor: "#F7F9FC"
ModernPanelColor: "#FFFFFF"
ModernPanelSecondaryColor: "#F1F5F9"
ModernTextColor: "#1F2937"
ModernTextSecondaryColor: "#64748B"
ModernBorderColor: "#DCE5EF"
ModernSeparatorColor: "#E6ECF3"
ModernHoverColor: "#EAF4FF"
ModernSelectedColor: "#D9ECFF"
ModernDisabledColor: "#AAB6C3"
ModernTooltipBackgroundColor: "#FFFFFF"
ModernIconsFolder: "images_modern"

# --- Metrics -------------------------------------------------------------------------------------
ModernRadius: "6px"
ModernRadiusSmall: "4px"
ModernToolbarButtonPadding: "5px"
ModernMenuItemPadding: "5px 28px 5px 10px"
ModernScrollbarWidth: "9px"
ModernTabPadding: "6px 18px"
ModernCommandPanelTabPadding: "7px 28px"

# --- Tokens consumed by FreeCAD.qss ------------------------------------------------------------
PrimaryColor: "@ModernAppBackgroundColor"
PrimaryColorDarken1: "darken(@PrimaryColor,2)"
PrimaryColorDarken2: "darken(@PrimaryColor,4)"
PrimaryColorDarken3: "darken(@PrimaryColor,6)"
PrimaryColorDarken4: "@ModernBorderColor"
PrimaryColorDarken5: "darken(@PrimaryColor,40)"
PrimaryColorDarken6: "darken(@PrimaryColor,60)"
PrimaryColorLighten1: "@ModernPanelColor"
PrimaryColorLighten2: "@ModernPanelColor"
PrimaryColorLighten3: "@ModernPanelColor"
PrimaryColorLighten4: "@ModernPanelColor"
PrimaryColorLighten5: "@ModernPanelColor"
PrimaryColorLighten6: "@ModernPanelColor"

3DViewBackgroundRefColor: "@ModernPanelColor"
AccentColor: "@ModernAccentColor"
AccentBackgroundColor: "@ModernSelectedColor"
AccentHoverColor: "@ModernHoverColor"
ActiveTabBackgroundColor: "@ModernPanelColor"
ButtonBackgroundHooverColor: "@ModernHoverColor"
ButtonBorderColor: "@ModernBorderColor"
ButtonBorderHooverColor: "@ModernAccentColor"
ButtonBottomBackgroundColor: "@ModernPanelColor"
ButtonTopBackgroundColor: "@ModernPanelColor"
CheckBoxBackgroundColor: "@ModernPanelColor"
CheckBoxBorderColor: "@ModernBorderColor"
CheckedButtonBottomBackgroundColor: "@ModernSelectedColor"
CheckedButtonTopBackgroundColor: "@ModernSelectedColor"
DefaultButtonBorderColor: "@ModernAccentColor"
DefaultButtonBottomBackgroundColor: "@ModernHoverColor"
DefaultButtonTopBackgroundColor: "@ModernHoverColor"
DialogBackgroundColor: "@ModernAppBackgroundColor"
GeneralAlternateBackgroundColor: "@ModernPanelSecondaryColor"
GeneralBackgroundColor: "@ModernPanelColor"
GeneralBackgroundHoverColor: "@ModernHoverColor"
GeneralBorderColor: "@ModernBorderColor"
GeneralBorderHoverColor: "@ModernAccentColor"
GeneralDisabledBackgroundColor: "@ModernPanelSecondaryColor"
GeneralGridLinesColor: "@ModernBorderColor"
GeneralHeaderBackgroundColor: "@ModernPanelSecondaryColor"
GroupboxBackgroundColor: "@ModernPanelColor"
GroupboxBorderColor: "@ModernBorderColor"
IconsLocationFolderName: "images_classic"
InActiveTabBackgroundColor: "@ModernPanelSecondaryColor"
InputFieldBorderRadius: "@ModernRadiusSmall"
MenuBackgroundColor: "@ModernPanelColor"
RadioButtonBackgroundColor: "@ModernPanelColor"
RadioButtonBorderColor: "@ModernBorderColor"
ScrollbarBackgroundColor: "transparent"
SketcherConflictingConstraintsColor: "#E5484D"
SketcherEmptySketchColor: "@ModernTextColor"
SketcherFullyConstrainedColor: "#26A269"
SketcherMalformedConstraintsColor: "#E5484D"
